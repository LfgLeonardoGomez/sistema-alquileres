[alembic]
script_location = migrations

# The database URL is intentionally not set here. migrations/env.py reads
# MIGRATOR_DATABASE_URL directly from the process environment -- the same
# variable scripts/reset_db.py and scripts/seed.py already use -- so no
# credential is ever committed to this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
